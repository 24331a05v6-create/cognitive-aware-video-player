<!DOCTYPE html>
<html>
<head>
    <title>Signup with OTP</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="card-bg">
<div class="card">
<h2>Signup</h2>

<input type="text" id="username" placeholder="Username"><br><br>
<input type="email" id="email" placeholder="Email"><br><br>
<input type="password" id="password" placeholder="Password"><br><br>
<input type="password" id="confirm_password" placeholder="Confirm Password"><br><br>

<button onclick="sendOtp()">Send OTP</button><br><br>

<input type="text" id="otp" placeholder="Enter OTP"><br><br>

<button onclick="signup()">Signup</button>

<p id="result"></p>
</div>

<script>
function sendOtp() {
    const email = document.getElementById("email").value;

    fetch("http://192.168.1.4:3000/api/send-otp", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ email: email })
    })
    .then(res => res.json())
    .then(data => {
        document.getElementById("result").innerText = data.message;
    });
}

function signup() {
    const username = document.getElementById("username").value;
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;
    const confirm_password = document.getElementById("confirm_password").value;
    const otp = document.getElementById("otp").value;

    fetch("http://192.168.1.4:3000/api/signup", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            username,
            email,
            password,
            confirm_password,
            otp
        })
    })
    .then(res => res.json())
    .then(data => {
        document.getElementById("result").innerText = data.message;

        // Redirect if signup successful
        if (data.message.toLowerCase().includes("successful")) {
            setTimeout(() => {
                window.location.href = "/login";
            }, 1000);
        }
    });
}
</script>


</body>
</html>
